[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quarter-car-mr-damper"
version = "1.0.0"
description = "Coupled 2-DOF Quarter-Car Vehicle Handling Dynamics with Spencer Modified Bouc-Wen MR Damper"
readme = "README.md"
authors = [{ name = "W. M. Baig" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "matplotlib>=3.5.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
